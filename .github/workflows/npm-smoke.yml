name: Published npm smoke test

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version or dist-tag to verify
        default: latest
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: activity_smoke
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d activity_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/activity_smoke
      PACKAGE_VERSION: ${{ inputs.package_version || 'latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node scripts/smoke-published-package.mjs
